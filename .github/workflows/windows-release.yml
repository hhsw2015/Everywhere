name: (Windows) Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3). Must exist on the repo.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Enable long paths in git
      run: git config --global core.longpaths true

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        fetch-depth: 0
        submodules: true
        # See macos-release.yml: skip LFS to avoid bandwidth quota.
        lfs: false

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Resolve version
      shell: pwsh
      run: node scripts/resolve-release-tag.mjs "$env:GITHUB_REF_NAME"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup

    - name: Install SimplySignDesktop
      shell: pwsh
      run: |
        $msiPath = "tools/sign_windows/SimplySignDesktop-9.3.3.71-64-bit-en.msi"
        if (-not (Test-Path $msiPath)) {
            Write-Error "MSI file not found at: $msiPath"
            exit 1
        }

        $absMsiPath = Convert-Path $msiPath
        $logPath = "$PWD\install.log"

        Write-Host "Installing SimplySignDesktop from $absMsiPath..."
        $process = Start-Process msiexec -ArgumentList "/i `"$absMsiPath`" /qn /norestart ALLUSERS=1 /l*v `"$logPath`"" -Wait -PassThru

        if ($process.ExitCode -ne 0) {
            Write-Host "SimplySignDesktop installation failed with exit code $($process.ExitCode)"
            if (Test-Path $logPath) {
                Write-Host "----------------------------------------------------------------"
                Write-Host "Install Log Content:"
                Write-Host "----------------------------------------------------------------"
                Get-Content $logPath
                Write-Host "----------------------------------------------------------------"
            } else {
                Write-Host "Log file not found at $logPath"
            }
            exit $process.ExitCode
        }
        Write-Host "SimplySignDesktop installed successfully."

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install Workloads
      run: dotnet workload restore src/Everywhere.Windows/Everywhere.Windows.csproj

    - name: Restore
      shell: pwsh
      run: |
        dotnet restore Everywhere.Windows.slnx -r win-x64

    - name: Publish Everywhere.Windows
      shell: pwsh
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        AI_GATEWAY_BASE_URL: ${{ vars.AI_GATEWAY_BASE_URL }}
        ACCOUNT_BASE_URL: ${{ vars.ACCOUNT_BASE_URL }}
        CLOUD_SYNC_BASE_URL: ${{ vars.CLOUD_SYNC_BASE_URL }}
      run: |
        dotnet publish src/Everywhere.Windows/Everywhere.Windows.csproj `
          -c Release `
          --self-contained true `
          -p:Version="$env:VERSION_PREFIX" `
          -p:SemanticVersion="$env:SEMANTIC_VERSION" `
          -p:SentryDsn="$env:SENTRY_DSN" `
          -p:ClientId="$env:CLIENT_ID" `
          -p:AIGatewayBaseUrl="$env:AI_GATEWAY_BASE_URL" `
          -p:AccountBaseUrl="$env:ACCOUNT_BASE_URL" `
          -p:CloudSyncBaseUrl="$env:CLOUD_SYNC_BASE_URL" `
          -o ./publish `
          --no-restore

    - name: Check signing secrets
      id: check_signing
      shell: pwsh
      run: |
        if ("${{ secrets.CERTUM_USERNAME }}" -and "${{ secrets.CERTUM_OTP_TOKEN }}") {
          echo "has_cert=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        } else {
          echo "has_cert=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "::warning::Code signing secrets not configured. Building unsigned."
        }

    - name: Login, Compile, and Sign
      if: steps.check_signing.outputs.has_cert == 'true'
      shell: pwsh
      env:
        SIGN_USERNAME: ${{ secrets.CERTUM_USERNAME }}
        SIGN_OTP_TOKEN: ${{ secrets.CERTUM_OTP_TOKEN }}
      run: |
        python -m pip install --upgrade pip
        pip install pyotp
        python -u tools/sign_and_pack.py ./publish tools/installer.iss

    - name: Pack without signing
      if: steps.check_signing.outputs.has_cert != 'true'
      shell: pwsh
      run: |
        $iscc = Get-Command iscc -ErrorAction SilentlyContinue
        if ($iscc) {
          iscc /DMyAppVersion="$env:VERSION" tools/installer.iss
        } else {
          Write-Host "::warning::Inno Setup not found, skipping installer creation."
        }

    - name: Create release zip
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Everywhere-Windows-x64-v$env:VERSION.zip

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v3
      with:
        draft: false
        make_latest: false
        prerelease: ${{ env.PRERELEASE }}
        generate_release_notes: ${{ env.PRERELEASE }}
        tag_name: ${{ env.RELEASE_TAG }}
        files: |
          ./Everywhere-Windows-x64-v${{env.VERSION}}.zip
          ./Everywhere-Windows-x64-Setup-v${{env.VERSION}}.exe
