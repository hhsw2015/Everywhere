name: (macOS) Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3). Must exist on the repo.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - runtime: osx-x64
            asset_name: macOS-x64
          - runtime: osx-arm64
            asset_name: macOS-arm64

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        fetch-depth: 0
        submodules: true
        # 3rd/open-codex-computer-use is a reference submodule whose LFS
        # objects (a 100MB+ zip) blow the repo's bandwidth quota on every
        # build. Nothing in the build pipeline reads those bytes.
        lfs: false

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Verify Swift toolchain (required for AxHelper dylib)
      run: |
        which swift
        swift --version
        echo "Swift OK — AxHelper dylib build will be exercised by dotnet publish."

    - name: Resolve version
      run: node scripts/resolve-release-tag.mjs "$GITHUB_REF_NAME"

    # Connector bundle build target needs esbuild — install repo tooling
    # deps before dotnet publish invokes the MSBuild target.
    - name: Install Node tooling deps (esbuild etc.)
      run: npm install --no-audit --no-fund

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.202'

    - name: Check signing secrets
      id: check_signing
      run: |
        if [ -n "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.MACOS_CERTIFICATE_PWD }}" ]; then
          echo "has_cert=true" >> $GITHUB_OUTPUT
        else
          echo "has_cert=false" >> $GITHUB_OUTPUT
          echo "::warning::Code signing certificate not configured. Building unsigned."
        fi

    - name: Import Code Signing Certificate
      if: steps.check_signing.outputs.has_cert == 'true'
      env:
        P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        security create-keychain -p "" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "" $KEYCHAIN_PATH

        CERT_PATH=$RUNNER_TEMP/certificate.p12
        echo "$P12_BASE64" | base64 --decode -o $CERT_PATH

        curl -fLo $RUNNER_TEMP/AppleRootCA-G2.cer https://www.apple.com/certificateauthority/AppleRootCA-G2.cer
        curl -fLo $RUNNER_TEMP/AppleRootCA-G3.cer https://www.apple.com/certificateauthority/AppleRootCA-G3.cer
        curl -fLo $RUNNER_TEMP/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

        security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security import $RUNNER_TEMP/AppleRootCA-G2.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/productbuild || echo "AppleRootCA-G2 import failed or already exists"
        security import $RUNNER_TEMP/AppleRootCA-G3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/productbuild || echo "AppleRootCA-G3 import failed or already exists"
        security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/productbuild || echo "DeveloperIDG2CA import failed or already exists"
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Install Workloads
      run: |
        dotnet workload update --version 10.0.202
        dotnet workload install macos --skip-manifest-update

    - name: Restore
      run: |
        dotnet restore Everywhere.Mac.slnx \
          -r ${{ matrix.runtime }} \
          /p:RuntimeIdentifier=${{ matrix.runtime }}

    - name: Publish
      env:
        CODE_SIGN_KEY: ${{ steps.check_signing.outputs.has_cert == 'true' && secrets.CODE_SIGN_KEY || '' }}
        PACKAGE_SIGNING_KEY: ${{ steps.check_signing.outputs.has_cert == 'true' && secrets.PACKAGE_SIGNING_KEY || '' }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        AI_GATEWAY_BASE_URL: ${{ vars.AI_GATEWAY_BASE_URL }}
        ACCOUNT_BASE_URL: ${{ vars.ACCOUNT_BASE_URL }}
        CLOUD_SYNC_BASE_URL: ${{ vars.CLOUD_SYNC_BASE_URL }}
      run: |
        SIGN_ARGS=""
        if [ -n "$CODE_SIGN_KEY" ]; then
          SIGN_ARGS="/p:CodesignKey=\"$CODE_SIGN_KEY\" /p:PackageSigningKey=\"$PACKAGE_SIGNING_KEY\""
        else
          SIGN_ARGS="/p:CodesignKey=- /p:PackageSigningKey="
        fi

        eval dotnet publish src/Everywhere.Mac/Everywhere.Mac.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          /p:RuntimeIdentifier=${{ matrix.runtime }} \
          $SIGN_ARGS \
          /p:Version="$VERSION_PREFIX" \
          /p:SemanticVersion="$SEMANTIC_VERSION" \
          /p:SentryDsn="$SENTRY_DSN" \
          /p:ClientId="$CLIENT_ID" \
          /p:AIGatewayBaseUrl="$AI_GATEWAY_BASE_URL" \
          /p:AccountBaseUrl="$ACCOUNT_BASE_URL" \
          /p:CloudSyncBaseUrl="$CLOUD_SYNC_BASE_URL" \
          /p:IsPublish="true" \
          -o ./publish \
          --no-restore

    - name: Notarize App
      if: steps.check_signing.outputs.has_cert == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_PWD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        PKG_PATH=$(find ./publish -name "Everywhere-*.pkg" | head -n 1)

        if [ -z "$PKG_PATH" ]; then
          echo "Error: .pkg file not found in ./publish!"
          exit 1
        fi

        echo "Found package: $PKG_PATH"

        echo "Notarizing..."
        xcrun notarytool submit "$PKG_PATH" \
          --apple-id "$APPLE_ID" \
          --team-id "$APPLE_TEAM_ID" \
          --password "$APPLE_PWD" \
          --wait

        echo "Stapling..."
        xcrun stapler staple "$PKG_PATH"

        mkdir -p ./release_assets
        mv "$PKG_PATH" ./release_assets/Everywhere-${{ matrix.asset_name }}-v${{ env.VERSION }}.pkg

    - name: Prepare unsigned release asset
      if: steps.check_signing.outputs.has_cert != 'true'
      run: |
        mkdir -p ./release_assets
        APP_PATH=$(find . -name "Everywhere.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: .app bundle not found!"
          find . -name "*.app" -type d
          exit 1
        fi
        APP_DIR=$(dirname "$APP_PATH")
        cd "$APP_DIR"
        zip -r -y "$GITHUB_WORKSPACE/release_assets/Everywhere-${{ matrix.asset_name }}-v${{ env.VERSION }}.zip" "$(basename "$APP_PATH")"

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v3
      with:
        draft: false
        make_latest: false
        prerelease: ${{ env.PRERELEASE }}
        generate_release_notes: ${{ env.PRERELEASE }}
        tag_name: ${{ env.RELEASE_TAG }}
        files: ./release_assets/*
