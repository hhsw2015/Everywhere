name: (Tests) DocReaders
on:
  push:
    branches: [experiment/doc-readers]
    paths:
      - 'tests/Everywhere.DocReaders.Tests/**'
      - 'tests/doc-corpus/**'
      - 'src/Everywhere.Mcp/Tools/Doc**'
      - 'src/Everywhere.Mcp/Tools/GetFinderSelection*'
      - 'Directory.Packages.props'
      - '.github/workflows/tests-doc-readers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # LFS not needed: corpus & semantic-kernel are plain git, and pulling
          # LFS hits the repository's bandwidth quota on every CI run.
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'
      - name: Install golden-text CLI tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils pandoc python3-openpyxl xlsx2csv
      - name: Generate goldens
        run: bash tests/doc-corpus/generate-goldens.sh
      - name: Verify goldens present
        run: bash tests/doc-corpus/check-goldens.sh
      - name: Restore
        run: dotnet restore tests/Everywhere.DocReaders.Tests/Everywhere.DocReaders.Tests.csproj
      - name: Build
        run: dotnet build tests/Everywhere.DocReaders.Tests/Everywhere.DocReaders.Tests.csproj -c Release --no-restore
      - name: Test
        run: |
          dotnet test tests/Everywhere.DocReaders.Tests/Everywhere.DocReaders.Tests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
