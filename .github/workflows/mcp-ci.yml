name: (MCP) Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'src/Everywhere.Mcp/**'
      - 'src/Everywhere.Abstractions/**'
      - 'src/Everywhere.Core/**'
      - 'src/Everywhere.Terminal/**'
      - 'tests/Everywhere.Mcp.Tests/**'
      - '3rd/open-connector/**'
      - 'scripts/build-connector-bundle.mjs'
      - 'package.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'src/Everywhere.Mcp/**'
      - 'src/Everywhere.Core/**'
      - 'tests/Everywhere.Mcp.Tests/**'
      - '3rd/open-connector/**'
      - 'scripts/build-connector-bundle.mjs'
      - 'package.json'
      - 'Directory.Packages.props'
      - '.github/workflows/mcp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # LFS off — open-codex-computer-use zip blows the bandwidth
          # quota and MCP CI doesn't need it (matches release workflows).
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Connector bundle must exist before `dotnet build` runs — the C#
      # runtime probes the emitted dist/ at boot. SPEC everywhere-connector.md §5.
      - name: Install node deps (connector bundle)
        run: npm ci || npm install
        working-directory: ${{ github.workspace }}

      - name: Build connector bundle
        run: node scripts/build-connector-bundle.mjs
        working-directory: ${{ github.workspace }}

      - name: Restore
        run: dotnet restore src/Everywhere.Mcp/Everywhere.Mcp.csproj

      - name: Restore tests
        run: dotnet restore tests/Everywhere.Mcp.Tests/Everywhere.Mcp.Tests.csproj

      - name: Build (Everywhere.Mcp)
        run: dotnet build src/Everywhere.Mcp/Everywhere.Mcp.csproj -c Release --no-restore

      - name: Build (Everywhere.Mcp.Tests)
        run: dotnet build tests/Everywhere.Mcp.Tests/Everywhere.Mcp.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Everywhere.Mcp.Tests/Everywhere.Mcp.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
