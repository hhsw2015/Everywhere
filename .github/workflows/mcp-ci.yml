name: (MCP) Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'src/Everywhere.Mcp/**'
      - 'src/Everywhere.Abstractions/**'
      - 'src/Everywhere.Core/**'
      - 'src/Everywhere.Terminal/**'
      - 'tests/Everywhere.Mcp.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'src/Everywhere.Mcp/**'
      - 'src/Everywhere.Core/**'
      - 'tests/Everywhere.Mcp.Tests/**'
      - 'Directory.Packages.props'
      - '.github/workflows/mcp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'

      - name: Restore
        run: dotnet restore src/Everywhere.Mcp/Everywhere.Mcp.csproj

      - name: Restore tests
        run: dotnet restore tests/Everywhere.Mcp.Tests/Everywhere.Mcp.Tests.csproj

      - name: Build (Everywhere.Mcp)
        run: dotnet build src/Everywhere.Mcp/Everywhere.Mcp.csproj -c Release --no-restore

      - name: Build (Everywhere.Mcp.Tests)
        run: dotnet build tests/Everywhere.Mcp.Tests/Everywhere.Mcp.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Everywhere.Mcp.Tests/Everywhere.Mcp.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
